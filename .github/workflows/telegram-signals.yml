name: Telegram Signals

on:
  schedule:
    # Every hour at :02 — bot auto-detects daily (06:00 UTC) vs hourly mode
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: auto (default), daily, or hourly'
        default: 'auto'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: |
            bot/daily-state.json
            bot/signal-log.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run signal scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: node bot/telegram-bot.js
        timeout-minutes: 5

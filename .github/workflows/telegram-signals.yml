name: Telegram Signals

on:
  schedule:
    # Every hour at :02 — bot auto-detects daily (06:00 UTC) vs hourly mode
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: auto, daily, hourly, test-trade, test-long, test-short, test-both'
        default: 'auto'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: |
            bot/daily-state.json
            bot/signal-log.json
            bot/trades.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Test OKX trading
        if: ${{ startsWith(github.event.inputs.mode, 'test-') }}
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_LIVE: "true"
        run: node bot/test-trade.js ${{ github.event.inputs.mode == 'test-trade' && 'check' || github.event.inputs.mode == 'test-long' && 'long' || github.event.inputs.mode == 'test-short' && 'short' || 'both' }}
        timeout-minutes: 2

      - name: Run signal scanner
        if: ${{ !startsWith(github.event.inputs.mode, 'test-') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_LIVE: "true"
          MAX_POSITIONS: ${{ secrets.MAX_POSITIONS }}
        run: node bot/telegram-bot.js
        timeout-minutes: 5

      - name: Publish track record data
        run: |
          if [ -f track-record-data.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add track-record-data.json
            git diff --cached --quiet || git commit -m "Update track record data [skip ci]" && git push
          fi
